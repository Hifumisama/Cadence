; Trois processus dans un seul conteneur (RunPod ne permet pas docker compose dans un Pod).
; Les journaux partent sur la sortie standard : ils s'affichent dans la console du Pod.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Télécharge les modèles qui manquent sur le volume (models.manifest). En parallèle du reste : ComfyUI et
; Tailscale démarrent sans attendre. Désactivé par CADENCE_TELECHARGER=0.
[program:modeles]
command=/opt/cadence/telecharger-modeles.sh
autostart=%(ENV_CADENCE_DL_AUTOSTART)s
autorestart=false
startsecs=0
exitcodes=0
priority=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:tailscaled]
command=tailscaled --tun=userspace-networking --state=mem: --socket=/var/run/tailscale/tailscaled.sock
autostart=%(ENV_CADENCE_TS_AUTOSTART)s
autorestart=true
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:tailscale-up]
command=/opt/cadence/tailscale-up.sh
autostart=%(ENV_CADENCE_TS_AUTOSTART)s
autorestart=false
startsecs=0
exitcodes=0
priority=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:llama-swap]
command=llama-swap --config /etc/cadence/llama-swap.yaml --listen 0.0.0.0:8080
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:comfyui]
command=/opt/cadence/run-comfyui.sh
directory=/opt/ComfyUI
autorestart=true
startsecs=10
priority=40
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Coupe-circuit : arrête le Pod après CADENCE_INACTIVITE_MIN minutes (défaut 15) sans aucune activité. Voir veille.sh.
[program:veille]
command=/opt/cadence/veille.sh
autorestart=false
startsecs=0
exitcodes=0
priority=50
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
