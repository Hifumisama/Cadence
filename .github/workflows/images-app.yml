# Construit les images web et worker de Cadence et les publie sur ghcr.io/<compte>/cadence-web et cadence-worker.
# Déclenchement : chaque push sur main (hors docs et image GPU), ou à la main (onglet Actions → « Images application »).
# Sur le mini PC, Watchtower voit la nouvelle étiquette « latest » et redémarre web et worker (docker-compose.prod.yml).
# Aucun jeton à créer : le GITHUB_TOKEN du workflow suffit. Première fois : rendre les deux paquets publics
# (GitHub → ton profil → Packages → cadence-web / cadence-worker → Package settings → Change visibility).
name: Images application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/gpu/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/image-gpu.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: images-app
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: cadence-web
            dockerfile: Dockerfile.web
          - nom: cadence-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
