# Vérifications du code : types, tests unitaires, code mort (knip).
# Déclenchement : chaque push (toutes branches) et chaque pull request.
# Pas de GPU. Un PostgreSQL jetable (service ci-dessous) sert aux tests qui touchent la base ; sans lui ils sont ignorés.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgres://cadence:cadence@localhost:5432/cadence
      - name: Code mort
        run: npm run knip
