# Construit l'image GPU (deploy/gpu) chez GitHub et la publie sur ghcr.io/<compte>/cadence-gpu.
# Déclenchement : à la main (onglet Actions → « Image GPU » → Run workflow) ou en poussant un tag « gpu-* ».
# Aucun jeton à créer pour pousser : le GITHUB_TOKEN du workflow suffit. La construction contrôle aussi, à la
# fin du Dockerfile, que ComfyUI connaît toutes les options de run-comfyui.sh.
name: Image GPU

on:
  workflow_dispatch:
  push:
    tags: ["gpu-*"]

permissions:
  contents: read
  packages: write

jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Le disque système du runner n'a qu'une quinzaine de Go libres : l'image CUDA + PyTorch (et ses couches de
      # construction) y tient pas (« no space left on device » à l'export). Le second disque, /mnt, en a une soixantaine :
      # on y déplace tout le stockage de Docker (et donc de BuildKit) avant de construire.
      - name: Libérer de la place et déplacer Docker sur /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          echo "Avant :"; df -h / /mnt
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new > /dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          else
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json > /dev/null
          fi
          sudo systemctl start docker
          docker info --format 'Docker Root Dir : {{.DockerRootDir}}'
          echo "Après :"; df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cadence-gpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: deploy/gpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
