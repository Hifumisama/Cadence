services:
  # Postgres seul, pour le développement local — web et worker tournent
  # directement sur la machine (npm run dev / npm run worker), pas en
  # conteneur : rebuild une image à chaque modif de code serait plus lent
  # que le hot-reload de `next dev`. Le docker-compose.yml (racine) reste
  # celui de la prod, avec web + worker + le mount NFS du mini PC.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
    volumes:
      - cadence_postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Volume distinct de celui de la prod (cadence_postgres_data) — une base
  # de dev qu'on peut détruire/recréer sans jamais toucher à la prod.
  cadence_postgres_dev_data:
