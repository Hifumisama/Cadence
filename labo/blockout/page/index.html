<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blockout</title>
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="rendu"></canvas>
    <script type="module">
      import { preparer } from "./scene.js";
      // rendre.mjs appelle `window.preparer(plan, nombreImages)` puis `window.image(i)` pour chaque image.
      window.preparer = (plan, n) => {
        window.image = preparer(document.getElementById("rendu"), plan, n);
      };
      window.pret = true;
    </script>
  </body>
</html>
