<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labo Cadence</title>
<style>
  :root {
    --ground: #121217; --surface: #1a1a21; --surface-2: #212129; --surface-3: #282833;
    --line: #2c2c36; --line-strong: #3a3a47;
    --ink: #e9e6e0; --ink-2: #c4c0cc; --ink-3: #9d98a8;
    --ecarlate: #c8102e; --ecarlate-glow: #ff4f6d; --or: #c9a24b; --or-glow: #f0d089;
    --written: #8a8595;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
  h2 { font-size: 1.35rem; margin: 0; }
  h3 { font-size: 1.1rem; margin: 0; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .muted { color: var(--ink-3); }
  select, button { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; max-width: 100%; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile b { display: block; font-size: 2rem; line-height: 1.15; font-weight: 650; }
  .tile span { color: var(--ink-3); font-size: .95rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 14px; color: var(--ink-2); font-size: .95rem; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 26px; height: 14px; border-radius: 3px; display: inline-block; }
  .swatch.target { width: 3px; height: 18px; background: var(--ink); border-radius: 0; }
  .written { background: var(--written); }
  .added { background: repeating-linear-gradient(135deg, var(--or) 0 4px, #5d4c22 4px 8px); }
  .missing { border: 2px dashed var(--ecarlate-glow); background: rgba(200, 16, 46, .14); }
  .scene { display: grid; grid-template-columns: 250px 1fr; gap: 10px 20px; align-items: center; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .scene:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .scene .name strong { display: block; line-height: 1.3; }
  .scene .name small { color: var(--ink-3); }
  .gauge-row { display: grid; grid-template-columns: 1fr 112px; gap: 14px; align-items: center; }
  .gauge-row .seconds { color: var(--ink-2); font-size: .95rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gauge { position: relative; height: 22px; }
  .gauge .seg { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; }
  .gauge .seg.added { top: 7px; bottom: 7px; }
  .gauge .mark { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--ink); box-shadow: 0 0 0 2px var(--ground); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; grid-column: 2; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); }
  .chip i { font-style: normal; }
  .chip.bad { border-color: var(--ecarlate); color: #ffd5dc; } .chip.bad i { color: var(--ecarlate-glow); }
  .chip.warn { border-color: #6d5a2a; color: var(--or-glow); } .chip.warn i { color: var(--or); }
  .back { display: inline-block; margin-bottom: 14px; color: var(--ink-2); }
  .heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
  .nav { display: flex; gap: 8px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .figures { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 10px; color: var(--ink-3); }
  .figures b { color: var(--ink); font-size: 1.25rem; font-weight: 650; margin-right: 5px; }
  .panel .chips { margin-top: 12px; }
  .strip { display: flex; gap: 4px; margin-bottom: 14px; align-items: stretch; overflow-x: auto; padding: 2px; }
  .block { flex-basis: 0; min-width: 76px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
  .block[aria-current="true"] { border-color: var(--ink); background: var(--surface-3); }
  .block strong { display: flex; justify-content: space-between; gap: 6px; }
  .block strong i { font-style: normal; color: var(--ecarlate-glow); }
  .block small { color: var(--ink-3); white-space: nowrap; }
  .block .bar { display: flex; gap: 2px; height: 8px; }
  .block .bar span { border-radius: 2px; }
  .block.gap { border: 2px dashed var(--ecarlate-glow); background: rgba(200, 16, 46, .1); cursor: default; justify-content: center; color: #ffd5dc; border-radius: 10px; padding: 8px 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .issue { border-left: 3px solid var(--ecarlate); background: rgba(200, 16, 46, .1); border-radius: 0 8px 8px 0; padding: 8px 12px; margin-top: 10px; }
  .issue b { color: var(--ecarlate-glow); margin-right: 8px; }
  .issue q { display: block; color: var(--ink-2); margin-top: 4px; }
  .text { white-space: pre-wrap; max-width: 68ch; margin: 18px 0 0; font-size: 1.05rem; line-height: 1.7; }
  mark { background: rgba(200, 16, 46, .38); color: #fff; border-radius: 3px; padding: 0 2px; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  details ol, details ul { padding-left: 22px; max-width: 72ch; }
  details li { margin-bottom: 8px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-3); font-weight: 500; font-size: .9rem; }
  .note { color: var(--ink-3); font-size: .9rem; margin-top: 22px; }
  #tip { position: fixed; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 10px; font-size: .9rem; z-index: 5; }
  @media (max-width: 720px) {
    .scene { grid-template-columns: 1fr; }
    .chips { grid-column: 1; }
    .gauge-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" hidden></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const app = document.getElementById("app");
  const tip = document.getElementById("tip");

  /** Every text goes in through text nodes: nothing the model wrote is ever read as HTML. */
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key === "style") node.style.cssText = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
    node.append(...children.flat().filter((c) => c != null && c !== false));
    return node;
  }

  const seconds = (n) => `${String(Math.round(n * 10) / 10).replace(".", ",")} s`;
  const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
  const sum = (values) => values.reduce((a, b) => a + b, 0);
  const missingOf = (m) => Math.max(m.targetSeconds - m.rawSeconds, 0);

  function hoverable(node, text) {
    node.addEventListener("mousemove", (e) => {
      tip.hidden = false;
      tip.textContent = text;
      tip.style.left = `${Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8)}px`;
      tip.style.top = `${e.clientY + 16}px`;
    });
    node.addEventListener("mouseleave", () => (tip.hidden = true));
    return node;
  }

  /** What the model wrote, and what is missing up to the target (a line); the seconds the code adds are a thin strip over it. Same scale
   * for every scene of a source. */
  function gauge(metrics, scale) {
    const written = metrics.rawSeconds;
    // Drawn in this order: the strip of the code lies over the missing part.
    const parts = [
      ["written", 0, written, `${seconds(written)} écrites par le modèle`],
      ["missing", written, missingOf(metrics), `${seconds(missingOf(metrics))} manquantes`],
      ["added", written, metrics.codeSeconds, `${seconds(metrics.codeSeconds)} ajoutées par le code, sans texte en plus`],
    ];
    const label = parts.filter((p) => p[2] > 0).map((p) => p[3]).concat(`${seconds(metrics.targetSeconds)} visées`).join(", ");
    const box = el("div", { class: "gauge", role: "img", "aria-label": label });
    for (const [kind, start, length, text] of parts) {
      if (length <= 0) continue;
      box.append(hoverable(el("span", { class: `seg ${kind}`, style: `left:calc(${(100 * start) / scale}% + ${start ? 2 : 0}px);width:calc(${(100 * length) / scale}% - ${start ? 2 : 0}px)` }), text));
    }
    box.append(hoverable(el("span", { class: "mark", style: `left:${(100 * metrics.targetSeconds) / scale}%` }), `Cible : ${seconds(metrics.targetSeconds)}`));
    return box;
  }

  const legend = () =>
    el("p", { class: "legend" },
      el("span", {}, el("i", { class: "swatch written" }), "Écrit par le modèle"),
      el("span", {}, el("i", { class: "swatch added" }), "Ajouté par le code"),
      el("span", {}, el("i", { class: "swatch missing" }), "Manquant"),
      el("span", {}, el("i", { class: "swatch target" }), "Durée visée"),
    );

  const chip = (tone, icon, text) => el("span", { class: `chip ${tone}` }, el("i", { "aria-hidden": "true" }, icon), text);

  function sceneChips(scene) {
    const m = scene.metrics;
    if (!m) return [chip("bad", "✕", "Appel en échec")];
    const list = [];
    if (scene.retry?.triggered) list.push(chip("warn", "↺", "Relancée"));
    if (!m.targetReachable) list.push(chip("bad", "▲", `Pas assez de plans : ${m.plans} × ${data.maxPlanSeconds} s = ${seconds(m.maxReachableSeconds)}`));
    else if (missingOf(m) > 0) list.push(chip("bad", "▲", `${seconds(missingOf(m))} manquantes`));
    if (m.codeSeconds > 0) list.push(chip("warn", "+", `${seconds(m.codeSeconds)} ajoutées par le code`));
    if (m.codeSeconds < 0) list.push(chip("warn", "−", `${seconds(-m.codeSeconds)} retirées par le code`));
    if (m.stillPlans.length) list.push(chip("bad", "‖", plural(m.stillPlans.length, "plan immobile", "plans immobiles")));
    if (m.emptyPlans.length) list.push(chip("bad", "∅", plural(m.emptyPlans.length, "plan vide", "plans vides")));
    if (m.duplicatePairs.length) list.push(chip("bad", "⧉", plural(m.duplicatePairs.length, "doublon", "doublons")));
    if (m.repeatedGesturePairs.length) list.push(chip("bad", "↻", "Gestes répétés"));
    if (scene.review?.length) list.push(chip("", "✎", plural(scene.review.length, "correction de relecture", "corrections de relecture")));
    return list.length ? list : [chip("", "✓", "Aucune alerte automatique")];
  }

  const scaleOf = (source) => Math.max(1, ...source.scenes.map((s) => Math.max(s.target, s.metrics?.rawSeconds ?? 0, s.metrics?.adjustedSeconds ?? 0)));
  const link = (...parts) => `#/${parts.map(encodeURIComponent).join("/")}`;

  function sourcePicker(source, sceneId) {
    const select = el("select", { "aria-label": "Source affichée", onchange: (e) => {
      const next = data.sources.find((s) => s.id === e.target.value);
      location.hash = sceneId && next.scenes.some((s) => s.id === sceneId) ? link(next.id, sceneId) : link(next.id);
    } });
    for (const s of data.sources) select.append(el("option", { value: s.id, selected: s.id === source.id }, s.label));
    return select;
  }

  function header(source, sceneId) {
    return el("div", { class: "top" },
      el("div", {}, el("h1", {}, "Labo Cadence"), el("div", { class: "muted" }, `Jeu ${data.dataset}, figé le ${data.exportedAt}`)),
      sourcePicker(source, sceneId),
    );
  }

  function overview(source) {
    const measured = source.scenes.filter((s) => s.metrics).map((s) => s.metrics);
    const target = sum(measured.map((m) => m.targetSeconds));
    const added = sum(measured.map((m) => m.codeSeconds));
    const tile = (value, label) => el("div", { class: "tile" }, el("b", {}, value), el("span", {}, label));
    const scale = scaleOf(source);
    return [
      header(source),
      source.scenes.length < data.caseCount ? el("p", { class: "muted" }, `Cet essai porte sur ${plural(source.scenes.length, "scène", "scènes")} sur ${data.caseCount}.`) : null,
      el("div", { class: "tiles" },
        tile(seconds(sum(measured.map((m) => m.rawSeconds))), `écrites par le modèle, sur ${seconds(target)} visées`),
        tile(seconds(sum(measured.map(missingOf))), "manquantes dans ce que le modèle écrit"),
        tile(`${measured.filter((m) => !m.targetReachable).length} / ${measured.length}`, "scènes sans assez de plans pour la durée visée"),
        tile(`${added > 0 ? "+" : ""}${seconds(added)}`, "ajoutées ensuite par le code"),
      ),
      legend(),
      source.scenes.map((s) =>
        el("a", { class: "scene", href: link(source.id, s.id) },
          el("div", { class: "name" }, el("small", {}, `Projet ${s.project} · scène ${s.rank}`), el("strong", {}, s.title)),
          s.metrics
            ? el("div", { class: "gauge-row" }, gauge(s.metrics, scale), el("span", { class: "seconds" }, `${s.metrics.rawSeconds} / ${seconds(s.target)}`))
            : el("div", { class: "muted" }, "Pas de sortie à mesurer"),
          el("div", { class: "chips" }, sceneChips(s)),
        ),
      ),
      el("p", { class: "note" }, "Ces alertes sont des comptes automatiques : aucune ne dit qu'une scène est bonne."),
    ];
  }

  /** The description with the sentences the detectors point at highlighted. */
  function highlighted(text, phrases) {
    const ranges = phrases
      .map((p) => [text.indexOf(p), p.length])
      .filter(([at]) => at >= 0)
      .map(([at, length]) => [at, at + length])
      .sort((a, b) => a[0] - b[0]);
    const parts = [];
    let done = 0;
    for (const [from, to] of ranges) {
      if (to <= done) continue;
      const start = Math.max(from, done);
      parts.push(text.slice(done, start), el("mark", {}, text.slice(start, to)));
      done = to;
    }
    parts.push(text.slice(done));
    return el("p", { class: "text" }, parts);
  }

  function planStrip(source, scene, current) {
    const blocks = scene.plans.map((p, i) => {
      const delta = p.final - p.written;
      return el("button", {
        class: "block", style: `flex-grow:${Math.max(p.written, 1)}`, "aria-current": i === current ? "true" : null,
        title: p.title, onclick: () => (location.hash = link(source.id, scene.id, i + 1)),
      },
        el("strong", {}, `P${i + 1}`, p.issues.length ? el("i", { "aria-label": "à regarder" }, "▲") : null),
        el("small", {}, `${p.written} s${delta ? ` (${delta > 0 ? "+" : "−"}${Math.abs(delta)})` : ""}`),
        el("span", { class: "bar", "aria-hidden": "true" },
          el("span", { class: "written", style: `flex:${p.written}` }),
          delta > 0 ? el("span", { class: "added", style: `flex:${delta}` }) : null,
        ),
      );
    });
    const missing = missingOf(scene.metrics);
    if (missing > 0) blocks.push(el("div", { class: "block gap", style: `flex-grow:${missing}` }, el("strong", {}, `${seconds(missing)}`), el("small", {}, "manquantes")));
    return el("div", { class: "strip" }, blocks);
  }

  function planPanel(source, scene, current) {
    const p = scene.plans[current];
    const go = (i) => () => (location.hash = link(source.id, scene.id, i + 1));
    return el("section", { class: "panel" },
      el("div", { class: "heading" },
        el("h3", {}, `P${current + 1} · ${p.title}`),
        el("div", { class: "nav" },
          el("button", { onclick: go(current - 1), disabled: current === 0, "aria-label": "Plan précédent" }, "←"),
          el("button", { onclick: go(current + 1), disabled: current === scene.plans.length - 1, "aria-label": "Plan suivant" }, "→"),
        ),
      ),
      el("div", { class: "meta" },
        chip("", "⏱", p.final === p.written ? seconds(p.written) : `${seconds(p.written)} écrites, ${seconds(p.final)} après le code`),
        p.link ? chip("", p.link === "suite" ? "⇢" : "✂", p.link === "suite" ? "Suite du plan d'avant" : "Coupe") : null,
        p.strong ? chip("warn", "⚡", "Temps fort") : null,
      ),
      p.issues.map((issue) =>
        el("div", { class: "issue" }, el("b", {}, issue.label), issue.detail, issue.kind === "still" ? issue.phrases.map((ph) => el("q", {}, ph)) : null),
      ),
      highlighted(p.description, p.issues.flatMap((issue) => issue.phrases)),
    );
  }

  const fold = (title, ...content) => el("details", {}, el("summary", {}, title), content);
  const table = (head, rows) =>
    el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, head.map((h) => el("th", {}, h)))),
      el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c) => el("td", {}, String(c)))))),
    ));

  function extras(scene) {
    const orNone = (v) => (v == null ? "–" : seconds(v));
    return [
      scene.moments ? fold(`Moments demandés (${scene.moments.length})`, el("ol", {}, scene.moments.map((m) => el("li", {}, m)))) : el("p", { class: "muted" }, "Cette scène n'avait pas de liste de moments."),
      scene.stored
        ? fold(`Ce qui est en base (${plural(scene.stored.plans.length, "plan", "plans")})`,
            el("p", { class: "muted" }, `« ${scene.stored.title} », après relecture et retouches à la main.`),
            table(["Plan", "Liaison", "Stockée", "Demandée au rendu", "Mesurée dans le fichier"],
              scene.stored.plans.map((p) => [p.title, p.link ?? "–", seconds(p.storedSeconds), orNone(p.askedSeconds), orNone(p.measuredSeconds)])),
          )
        : null,
      scene.review?.length
        ? fold(`Corrections demandées en relecture (${scene.review.length})`, el("ul", {}, scene.review.map((r) => el("li", {}, el("b", {}, `${r.handle} · ${r.type} (${r.criterion}) : `), r.reason))))
        : null,
      fold("Détails de l'appel", table(["", ""], scene.facts)),
    ];
  }

  function detail(source, scene, current) {
    const index = source.scenes.indexOf(scene);
    const go = (i) => () => (location.hash = link(source.id, source.scenes[i].id));
    const m = scene.metrics;
    const figure = (value, label) => el("span", {}, el("b", {}, value), label);
    return [
      header(source, scene.id),
      el("a", { class: "back", href: link(source.id) }, "← Toutes les scènes"),
      el("div", { class: "heading" },
        el("div", {}, el("div", { class: "muted" }, `Projet ${scene.project} · scène ${scene.rank}`), el("h2", {}, scene.title)),
        el("div", { class: "nav" },
          el("button", { onclick: index > 0 ? go(index - 1) : null, disabled: index === 0 }, "Scène précédente"),
          el("button", { onclick: index < source.scenes.length - 1 ? go(index + 1) : null, disabled: index === source.scenes.length - 1 }, "Scène suivante"),
        ),
      ),
      m
        ? [
            el("section", { class: "panel" },
              legend(),
              gauge(m, scaleOf(source)),
              el("div", { class: "figures" },
                figure(seconds(m.rawSeconds), "écrites"),
                figure(seconds(m.targetSeconds), "visées"),
                missingOf(m) ? figure(seconds(missingOf(m)), "manquantes") : null,
                m.codeSeconds ? figure(`${m.codeSeconds > 0 ? "+" : ""}${seconds(m.codeSeconds)}`, "ajoutées par le code") : null,
              ),
              el("div", { class: "chips" }, sceneChips(scene)),
            ),
            scene.plans.length ? [planStrip(source, scene, current), planPanel(source, scene, current)] : null,
          ]
        : el("section", { class: "panel" }, el("b", {}, "Cet appel a échoué."), el("p", { class: "text" }, scene.error ?? "")),
      extras(scene),
    ];
  }

  let shown = null;
  function render() {
    const [sourceId, sceneId, plan] = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
    const source = data.sources.find((s) => s.id === sourceId) ?? data.sources[0];
    const scene = source.scenes.find((s) => s.id === sceneId);
    const current = scene ? Math.min(Math.max((Number(plan) || 1) - 1, 0), Math.max(scene.plans.length - 1, 0)) : 0;
    tip.hidden = true;
    app.replaceChildren(...(scene ? detail(source, scene, current) : overview(source)).flat(3).filter(Boolean));
    // Changing of plan keeps the reading position; changing of view or scene goes back to the top.
    const view = `${source.id}|${scene?.id ?? ""}`;
    if (view !== shown) window.scrollTo(0, 0);
    shown = view;
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    document.querySelector(`[aria-label="${e.key === "ArrowLeft" ? "Plan précédent" : "Plan suivant"}"]`)?.click();
  });
  render();
})();
</script>
</body>
</html>
