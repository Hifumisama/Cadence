<title>Atelier d'asset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Concept : une salle de projection. L'image est posée dans un passe-partout, sur un fond qui prend sa teinte ; le journal d'essais
   court à droite comme un registre de prises ; la consigne est juste dessous, à portée de main. L'or dit « validé / retenu »,
   l'écarlate dit « en travail / alerte » — jamais en fond. Thème unique sombre, comme l'application. */
:root{
  color-scheme:dark;
  --ground:#121217;--surface:#1a1a21;--surface-2:#212129;--surface-3:#282833;--line:#2c2c36;--line-strong:#3a3a47;
  --ink:#e9e6e0;--ink-2:#c4c0cc;--ink-3:#9d98a8;--ink-4:#8a8595;
  --ecarlate:#c8102e;--ecarlate-soft:#7a0f22;--ecarlate-glow:#ff4f6d;--or:#c9a24b;--or-soft:#8a7136;--or-glow:#f0d089;
  --film:#0b0b0f;--sur-or:#0e0e13;--blanc:#fff;
  --teinte:#c98a6a;
  --font-brand:"Marcellus",Georgia,"Times New Roman",serif;--font-data:"Jost",system-ui,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --r:6px;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-data);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:auto 0 0 0;height:42vh;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 130%,rgba(200,16,46,.10),transparent 62%),radial-gradient(80% 90% at 82% 120%,rgba(201,162,75,.06),transparent 60%)}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--or-glow);outline-offset:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{position:relative;z-index:1;max-width:1440px;margin-inline:auto}

/* ---------- Sélecteur de la maquette (hors design) ---------- */
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:6px 10px;border:1px dashed var(--line-strong);border-radius:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-4)}
.demo b{font-weight:500;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.demo .segs{display:flex;gap:4px;flex-wrap:wrap}
.demo button{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--ink-3);font-size:11.5px}
.demo button[aria-pressed=true]{border-color:var(--ink-3);color:var(--ink)}

/* ---------- Boutons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);padding:9px 16px;color:var(--ink-2);
  border-radius:4px;white-space:nowrap;font-size:14px;transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),box-shadow .3s var(--ease),transform .15s var(--ease)}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--or-soft);color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.btn-or{background:linear-gradient(160deg,var(--or-glow),var(--or));border-color:var(--or-glow);color:var(--sur-or);font-weight:500}
.btn-or:hover:not(:disabled){background:linear-gradient(160deg,var(--or-glow),var(--or));color:var(--sur-or);box-shadow:0 0 0 1px var(--or-glow),0 8px 28px -6px rgba(240,208,137,.55)}
.btn-trait{background:transparent;border-color:var(--or-soft);color:var(--or-glow)}
.btn-trait:hover:not(:disabled){background:rgba(201,162,75,.08);border-color:var(--or)}
.btn-fant{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn-fant:hover:not(:disabled){background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn-danger{background:transparent;border-color:rgba(200,16,46,.55);color:var(--ecarlate-glow)}
.btn-danger:hover:not(:disabled){background:rgba(200,16,46,.10);border-color:var(--ecarlate);color:var(--ecarlate-glow)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-ico{padding:7px;width:34px;height:34px;justify-content:center}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);transform:scale(0);animation:ripple .65s var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.lien{background:none;border:0;padding:0;color:var(--or);text-decoration:underline;text-decoration-color:var(--or-soft);text-underline-offset:3px;font-size:13px}
.lien:hover{color:var(--or-glow);text-decoration-color:var(--or-glow)}

/* ---------- Barre haute ---------- */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;font-size:13px;color:var(--ink-3)}
.crumb b{font-family:var(--font-brand);font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--or);font-size:14px;margin-right:6px}
.crumb .sep{color:var(--ink-4)}
.crumb .ici{color:var(--ink-2)}
.voisins{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12.5px;font-family:var(--font-mono)}
.voisins button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:4px;padding:5px 9px;color:var(--ink-3);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voisins button:hover{border-color:var(--line-strong);color:var(--or-glow)}
.voisins .rang{color:var(--ink-4);padding-inline:6px}

/* ---------- En-tête de la fiche ---------- */
.tete{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:start;padding-block:28px 22px}
.sur-titre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.type{display:inline-flex;align-items:center;gap:7px;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.type svg{width:14px;height:14px}
.code{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-4);letter-spacing:.02em;cursor:help}
.nom{margin-top:6px;display:flex;align-items:center;gap:10px;min-width:0}
.nom-btn{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:2px 6px 2px 0;text-align:left;border-radius:4px;min-width:0}
.nom-btn h1{font-family:var(--font-brand);font-size:clamp(34px,4.2vw,54px);line-height:1.05;letter-spacing:.005em;text-wrap:balance;overflow-wrap:anywhere}
.nom-btn .crayon{opacity:0;color:var(--ink-4);transform:translateX(-4px);transition:all .25s var(--ease)}
.nom-btn:hover .crayon,.nom-btn:focus-visible .crayon{opacity:1;transform:none}
.nom-champ{font-family:var(--font-brand);font-size:clamp(30px,4vw,50px);line-height:1.1;background:var(--ground);border:1px solid var(--or-soft);border-radius:4px;padding:2px 10px;width:min(100%,560px);box-shadow:0 0 0 3px rgba(201,162,75,.12)}
.nom-champ:focus{outline:none}
.desc{margin-top:14px;max-width:68ch;position:relative}
.desc-lecture{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:10px 12px;margin-left:-12px;color:var(--ink-2);font-size:16px;line-height:1.65;transition:background .25s var(--ease),border-color .25s var(--ease)}
.desc-lecture:hover{background:var(--surface);border-color:var(--line)}
.desc-lecture .indice{display:block;margin-top:4px;font-size:12px;color:var(--ink-4);opacity:0;transition:opacity .25s}
.desc-lecture:hover .indice,.desc-lecture:focus-visible .indice{opacity:1}
.desc-lecture.vide{color:var(--ink-4);font-style:italic}
.desc-edit{display:grid;gap:10px}
.desc-edit textarea{width:100%;min-height:110px;resize:vertical;background:var(--ground);border:1px solid var(--or-soft);border-radius:6px;padding:12px 14px;font-size:16px;line-height:1.6;box-shadow:0 0 0 3px rgba(201,162,75,.12)}
.desc-edit textarea:focus{outline:none}
.desc-edit .ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aide{font-size:12.5px;color:var(--ink-4)}
.aide.droite{margin-left:auto}

.etat-zone{display:grid;justify-items:end;gap:12px}
.etats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pilule{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 13px 5px 11px;border-radius:20px;border:1px solid var(--line-strong);color:var(--ink-2);transition:all .4s var(--ease)}
.pilule i{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none}
.pilule.a_produire{border-style:dashed;color:var(--ink-3)}
.pilule.a_produire i{background:none;border:1.5px dashed var(--ink-4)}
.pilule.en_cours{border-color:rgba(200,16,46,.45);color:var(--ecarlate-glow)}
.pilule.en_cours i{background:var(--ecarlate);box-shadow:0 0 0 3px rgba(200,16,46,.22)}
.pilule.valide{border-color:var(--or);color:var(--or-glow);background:rgba(201,162,75,.08);box-shadow:0 0 18px -6px rgba(240,208,137,.5)}
.pilule.valide i{background:var(--or-glow);box-shadow:0 0 8px var(--or-glow)}
.pilule.reflet::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,240,200,.65) 50%,transparent 70%);transform:translateX(-120%);animation:reflet 1.1s var(--ease-out) .05s forwards}
@keyframes reflet{to{transform:translateX(120%)}}
.critique{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:20px;border:1px solid rgba(200,16,46,.4);color:var(--ecarlate-glow);cursor:help}
.critique svg{width:13px;height:13px}
.actions-tete{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu{position:relative}
.pop{position:absolute;z-index:30;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;padding:6px;box-shadow:0 24px 48px -16px rgba(0,0,0,.9);display:grid;gap:2px;transform-origin:top right;animation:pop .2s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.opt{display:flex;gap:10px;align-items:flex-start;background:none;border:0;border-radius:4px;padding:8px 10px;text-align:left;color:var(--ink-2);font-size:14px}
.opt svg{width:15px;height:15px;margin-top:3px;flex:none}
.opt:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt small{display:block;font-size:12px;color:var(--ink-4);margin-top:2px}
.opt.danger{color:var(--ecarlate-glow)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

.apparus{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.apparus>span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);margin-right:4px}
.citation{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);font-family:var(--font-mono);font-size:12px;color:var(--ink-2);transition:all .25s var(--ease);animation:monte .4s var(--ease-out) both;animation-delay:calc(var(--i,0) * 40ms)}
.citation a{color:inherit;text-decoration:none;padding:4px 4px 4px 11px}
.citation a:hover{color:var(--or-glow)}
.citation:hover{border-color:var(--or-soft)}
.citation .x{background:none;border:0;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--ink-4);margin-right:2px}
.citation .x:hover{color:var(--ecarlate-glow);background:rgba(200,16,46,.12)}
.citation .x svg{width:11px;height:11px}
.citation.perime{border-style:dashed;border-color:rgba(200,16,46,.55);color:var(--ecarlate-glow)}
.citation.perime a::after{content:" · périmé";font-family:var(--font-data);font-size:11px}
.citation.confirme{border-color:var(--ecarlate);background:rgba(200,16,46,.08);padding:2px 4px 2px 11px;gap:6px;font-family:var(--font-data)}
.citation.confirme button{background:none;border:0;font-size:12px;padding:2px 8px;border-radius:12px;color:var(--ink-2)}
.citation.confirme button.oui{color:var(--ecarlate-glow)}
.citation.confirme button:hover{background:var(--surface-3)}
.citation.part{animation:part .3s var(--ease) forwards}
@keyframes part{to{opacity:0;transform:scale(.8);margin-right:-80px}}
.aucun{font-size:13px;color:var(--ink-4)}

/* ---------- Atelier ---------- */
.atelier{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"outils journal" "scene journal" "legende journal" "consigne journal";grid-template-rows:auto auto auto 1fr;gap:14px 20px;align-items:start;border-top:1px solid var(--line);padding-top:22px}
.outils{grid-area:outils;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.outils h2{font-family:var(--font-brand);font-size:20px;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.outils h2 small{font-family:var(--font-data);font-size:13px;color:var(--ink-4)}

.scene{grid-area:scene;position:relative;display:grid;place-items:center;min-height:clamp(340px,60vh,700px);padding:clamp(28px,4vw,60px) clamp(16px,4vw,60px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;isolation:isolate;
  background:radial-gradient(55% 65% at 50% 46%,color-mix(in srgb,var(--teinte) 26%,transparent),transparent 72%),radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.6),transparent 60%),var(--film);
  transition:background .8s var(--ease)}
.scene::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.scene.valide{box-shadow:inset 0 0 0 1px rgba(201,162,75,.35)}
.etiq{position:absolute;z-index:3;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);background:rgba(11,11,15,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);border-radius:3px;padding:3px 9px}
.etiq.hg{left:12px;top:12px;text-transform:uppercase;letter-spacing:.14em}
.etiq.hg.or{color:var(--or-glow);border-color:rgba(201,162,75,.35)}
.etiq.hd{right:12px;top:12px;font-family:var(--font-mono);letter-spacing:0}
.zoom-btn{position:absolute;z-index:3;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(11,11,15,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);transition:all .25s var(--ease)}
.zoom-btn:hover{color:var(--or-glow);border-color:var(--or-soft)}
.zoom-btn svg{width:14px;height:14px}

.passe{position:relative;max-width:100%;padding:clamp(8px,1.2vw,14px);background:linear-gradient(180deg,#25252e,#1b1b22);border:1px solid var(--line-strong);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 34px 70px -30px rgba(0,0,0,.95),0 0 90px -34px var(--teinte);transition:box-shadow .6s var(--ease),border-color .6s var(--ease)}
.passe::after{content:"";position:absolute;inset:clamp(8px,1.2vw,14px);border:1px solid rgba(0,0,0,.6);pointer-events:none}
.passe img{display:block;max-width:100%;max-height:min(56vh,620px);width:auto;height:auto;cursor:zoom-in}
.passe.entre{animation:entre .55s var(--ease-out)}
@keyframes entre{from{opacity:0;transform:scale(1.025);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.scene.valide .passe{border-color:var(--or-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 34px 70px -30px rgba(0,0,0,.95),0 0 0 1px rgba(201,162,75,.25),0 0 70px -26px rgba(240,208,137,.55)}
.scene.lueur .passe{animation:lueur 1.4s var(--ease-out)}
.scene.lueur .passe img{animation:eclat 1.4s var(--ease-out)}
@keyframes lueur{35%{border-color:var(--or-glow);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 34px 70px -30px rgba(0,0,0,.95),0 0 0 2px rgba(240,208,137,.7),0 0 110px -10px rgba(240,208,137,.7)}}
@keyframes eclat{35%{filter:brightness(1.12) saturate(1.08)}}

.boite{position:relative;width:min(100%,var(--w,560px));aspect-ratio:var(--ar,16/9);max-height:min(56vh,620px);max-width:100%;overflow:hidden;background:var(--surface)}
.boite.vierge{display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,#1d1d25 10px 20px);border:1px dashed var(--line-strong)}
.boite.vierge div{display:grid;gap:8px;justify-items:center;padding:20px;max-width:34ch}
.boite.vierge svg{width:42px;height:42px;color:var(--ink-4)}
.boite.vierge b{font-family:var(--font-brand);font-weight:400;font-size:21px;color:var(--ink)}
.boite.vierge p{font-size:14px;color:var(--ink-3)}
.boite .flou{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(var(--flou,24px)) saturate(var(--sat,.6));transform:scale(1.08);transition:filter .3s linear}
.boite.chatoie::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.09) 50%,transparent 75%);animation:glisse 1.6s linear infinite}
@keyframes glisse{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.boite.echec{display:grid;place-items:center;text-align:center;background:var(--surface);border:1px dashed rgba(200,16,46,.55)}
.boite.echec .fantome{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;filter:grayscale(1) blur(2px)}
.boite.echec div{position:relative;display:grid;gap:10px;justify-items:center;padding:20px;max-width:40ch}
.boite.echec b{font-family:var(--font-brand);font-weight:400;font-size:21px}
.boite.echec p{font-size:14px;color:var(--ink-3)}
.boite.echec .ligne{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.travail{position:absolute;z-index:4;left:50%;bottom:clamp(14px,2.4vw,26px);transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:rgba(18,18,23,.78);backdrop-filter:blur(10px);border:1px solid var(--line-strong);border-radius:8px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 20px 40px -20px #000;animation:monteC .45s var(--ease-out)}
@keyframes monteC{from{opacity:0;transform:translate(-50%,10px)}}
.travail .msg{font-size:14px;color:var(--ink);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.travail .msg .num{color:var(--ink-4);font-size:12px}
.etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.etape{display:grid;gap:6px;font-size:11.5px;color:var(--ink-4);letter-spacing:.04em}
.etape i{display:block;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
.etape i b{position:absolute;inset:0;width:var(--p,0%);background:linear-gradient(90deg,var(--ecarlate),var(--ecarlate-glow));border-radius:2px;transition:width .3s linear}
.etape.fait{color:var(--ink-3)}
.etape.fait i b{width:100%;background:var(--ink-4)}
.etape.actif{color:var(--ecarlate-glow)}
.etape.actif.indet i b{width:40%;animation:va 1.3s var(--ease) infinite}
@keyframes va{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

.legende{grid-area:legende;display:grid;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:72px}
.legende.glisse{animation:glisseL .4s var(--ease-out)}
@keyframes glisseL{from{opacity:0;transform:translateY(8px)}}
.leg-tete{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.qui{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.qui b{color:var(--ink-2);font-weight:500}
.leg-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg-corps{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.leg-corps q{flex:1 1 320px;min-width:0;quotes:"« " " »";font-family:var(--font-brand);font-size:20px;line-height:1.4;color:var(--ink);text-wrap:pretty}
.leg-corps .sans{flex:1 1 320px;color:var(--ink-3);font-size:15px}
.depart{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-4);background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px 5px 5px;transition:border-color .25s}

.retenu-badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--or-glow);border:1px solid var(--or-soft);background:rgba(201,162,75,.08);border-radius:20px;padding:5px 12px}
.retenu-badge svg{width:14px;height:14px}
details.prompt{border-top:1px solid var(--line);padding-top:10px}
details.prompt summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
details.prompt summary::-webkit-details-marker{display:none}
details.prompt summary svg{width:12px;height:12px;transition:transform .25s var(--ease)}
details.prompt[open] summary svg{transform:rotate(90deg)}
details.prompt summary:hover{color:var(--ink)}
details.prompt p{margin-top:10px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--ink-3);background:var(--ground);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-wrap:anywhere;animation:glisseL .3s var(--ease-out)}
.erreur-txt{color:var(--ecarlate-glow);font-size:14px}

/* Consigne */
.consigne{grid-area:consigne;position:relative;display:grid;gap:12px;padding:20px 22px 18px;border:1px solid var(--line-strong);border-radius:var(--r);background:linear-gradient(180deg,var(--surface-2),var(--surface));transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.consigne:focus-within{border-color:var(--or-soft);box-shadow:0 0 0 4px rgba(201,162,75,.08),0 20px 50px -30px rgba(240,208,137,.25)}
.consigne label{display:grid;gap:4px}
.consigne label b{font-family:var(--font-brand);font-weight:400;font-size:clamp(22px,2.2vw,27px);line-height:1.2}
.consigne label small{font-size:13.5px;color:var(--ink-3)}
.consigne textarea{width:100%;min-height:110px;resize:vertical;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:17px;line-height:1.55;transition:border-color .25s var(--ease)}
.consigne textarea::placeholder{color:var(--ink-4);font-style:italic}
.consigne textarea:focus{outline:none;border-color:var(--or-soft)}
.consigne textarea.secoue{animation:secoue .35s var(--ease)}
@keyframes secoue{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--line);color:var(--ink-2);font-size:13px;padding:4px 12px;border-radius:20px;transition:all .2s var(--ease)}
.puce::before{content:"+";color:var(--ink-4);font-family:var(--font-mono)}
.puce:hover{border-color:var(--or-soft);color:var(--or-glow);transform:translateY(-1px)}
.puce:hover::before{color:var(--or)}
.base{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3)}
.base img{width:28px;height:28px;border-radius:3px;object-fit:cover;border:1px solid var(--line-strong)}
.base b{color:var(--or-glow);font-weight:500}
.envoi{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.envoi .btn-or{padding:11px 20px;font-size:15px}
.kbd{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink-3)}
.envoi .aide{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.envoi .compte{margin-left:auto}

/* Journal d'essais */
.journal{grid-area:journal;position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;max-height:calc(100dvh - 32px);min-height:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.j-tete{flex:none;display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.j-tete h3{font-family:var(--font-brand);font-size:17px}
.j-tete .num{margin-left:auto;font-size:12px;color:var(--ink-4)}
.j-liste{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.j-sep{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);padding:12px 8px 4px;display:flex;align-items:center;gap:8px}
.j-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.j-item{position:relative;flex:none;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;width:100%;background:none;border:1px solid transparent;border-radius:5px;padding:7px;text-align:left;color:inherit;transition:background .2s var(--ease),border-color .2s var(--ease)}
.j-item:hover{background:var(--surface-2)}
.j-item.on{background:var(--surface-2);border-color:var(--or-soft);box-shadow:inset 2px 0 0 var(--or-glow)}
.j-item.arrive{animation:monte .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
.j-item.nouveau{animation:nouveau .6s var(--ease-out) both}
@keyframes monte{from{opacity:0;transform:translateY(8px)}}
@keyframes nouveau{from{opacity:0;transform:translateY(-14px) scale(.96);background:rgba(201,162,75,.15)}}
.vign{position:relative;display:block;width:62px;height:62px;border-radius:3px;overflow:hidden;background:var(--surface-3);border:1px solid var(--line-strong)}
.vign img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.j-item:hover .vign img{transform:scale(1.06)}
.vign.flou img{filter:blur(6px) saturate(.6);transform:scale(1.15)}
.vign.vide{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 5px,var(--surface-3) 5px 10px)}
.vign.run::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.18) 50%,transparent 80%);animation:glisse 1.3s linear infinite}
.vign.echec img{filter:grayscale(1);opacity:.35}
.vign .mini-p{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.5)}

.j-m{display:grid;gap:3px;min-width:0;padding-top:1px}
.j-l1{display:flex;align-items:center;gap:6px;min-width:0}
.j-l1 .num{font-size:12.5px;color:var(--ink)}
.j-l1 .quand{margin-left:auto;font-size:11.5px;color:var(--ink-4);white-space:nowrap}
.j-txt{font-size:13px;line-height:1.4;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.j-item.on .j-txt{color:var(--ink-2)}
.j-txt.titre{color:var(--ink);font-weight:500}
.drap{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.04em;padding:0 6px;border-radius:3px;line-height:17px;white-space:nowrap;border:1px solid}
.drap.or{color:var(--or-glow);border-color:var(--or-soft);background:rgba(201,162,75,.12)}
.drap.rouge{color:var(--ecarlate-glow);border-color:rgba(200,16,46,.5);background:rgba(200,16,46,.08)}
.drap.echec{color:var(--blanc);border-color:var(--ecarlate);background:var(--ecarlate)}
.drap.neutre{color:var(--ink-3);border-color:var(--line-strong)}
.j-vide{padding:18px 12px;font-size:13.5px;color:var(--ink-4);text-align:center;line-height:1.5}
.j-pied{flex:none;border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--ink-4);display:flex;gap:8px;align-items:center}

/* Voix */
.voix{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px 28px;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.voix h2{font-family:var(--font-brand);font-size:20px;display:flex;align-items:center;gap:10px}
.voix h2 svg{width:18px;height:18px;color:var(--or)}
.voix .col{display:grid;gap:12px;align-content:start;min-width:0}
.voix .desc-v{color:var(--ink-2);font-size:15px;line-height:1.6;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;resize:vertical;min-height:84px}
.voix .desc-v:focus{outline:none;border-color:var(--or-soft)}
.lecteur{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line-strong);border-radius:8px;background:var(--ground)}
.lire{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--or-glow),var(--or));border:0;color:var(--sur-or);transition:box-shadow .3s var(--ease),transform .15s}
.lire:hover{box-shadow:0 0 22px -4px rgba(240,208,137,.6)}
.lire:active{transform:scale(.95)}
.lire svg{width:16px;height:16px}
.onde{display:flex;align-items:center;gap:2px;height:40px;min-width:0;overflow:hidden;cursor:pointer}
.onde i{flex:1 1 0;min-width:2px;border-radius:2px;background:var(--line-strong);transition:background .15s}
.onde i.lu{background:var(--or)}
.lecteur .t{font-size:12.5px;color:var(--ink-3)}
.voix .meta{font-size:12.5px;color:var(--ink-4)}

/* Zoom plein écran */
.voile{position:fixed;inset:0;z-index:80;background:rgba(6,6,9,.92);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));animation:fondu .25s var(--ease)}
@keyframes fondu{from{opacity:0}}
.voile img{max-width:100%;max-height:100%;cursor:zoom-in;transition:transform .45s var(--ease-out);box-shadow:0 40px 80px -30px #000}
.voile.zoome img{cursor:zoom-out}
.voile .fermer{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(26,26,33,.8);border:1px solid var(--line-strong);border-radius:4px;color:var(--ink-2);padding:6px 12px;font-size:13px}
.voile .fermer:hover{color:var(--or-glow);border-color:var(--or-soft)}
.voile .indic{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--ink-4)}

.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:var(--surface-3);border:1px solid var(--or-soft);border-radius:6px;padding:10px 16px;font-size:14px;max-width:min(560px,calc(100% - 32px));transition:all .35s var(--ease-out);pointer-events:none;box-shadow:0 20px 40px -20px #000}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.ko{border-color:rgba(200,16,46,.55)}

@media (max-width:1060px){

}

}

/* ================= Simulation d'un essai ================= */
function deriver(v, txt, kind) {
  const t = txt.toLowerCase(), n = { ...v };
  if (kind === "phare") {
    if (/temp[êe]te|orage|pluie/.test(t)) n.heure = "tempete";
    else if (/bleue|nuit|étoile/.test(t)) n.heure = "bleue";
    else if (/crépuscule|soleil|couchant/.test(t)) n.heure = "crepuscule";
    if (/vive|brill|forte/.test(t)) n.vive = true;
    return n;
  }
  if (/chaud|loge|tungst/.test(t)) n.warm = 0.9;
  if (/froid|lune|nuit/.test(t)) { n.warm = 0.05; n.nuit = /nuit/.test(t); }
  if (/court|carré/.test(t)) n.hair = "court";
  if (/chignon|relev/.test(t)) n.hair = "chignon";
  if (/longs?\b|détach/.test(t)) n.hair = "long";
  if (/sans (le )?chapeau/.test(t)) n.hat = false; else if (/chapeau/.test(t)) n.hat = true;
  if (/âgée|gris|vieill/.test(t)) n.age = 1;
  if (/jeune/.test(t)) n.age = 0;
  if (/calme|serein/.test(t)) n.calme = true;
  if (/brod|doré/.test(t)) n.brode = true;
  if (/sombre/.test(t)) n.warm = Math.max(0, (n.warm ?? 0.4) - 0.25);
  if (JSON.stringify(n) === JSON.stringify(v)) n.warm = ((v.warm ?? 0.4) + 0.5) % 1;
  return n;
}
function lancer(texte) {
  const A = S.A, b = base(), ta = $("#cTexte");
  const consigne = (texte ?? ta.value).trim();
  if (b && !consigne) { ta.classList.remove("secoue"); void ta.offsetWidth; ta.classList.add("secoue"); ta.focus(); toast("Écris ce qu'on change : l'image actuelle sert de base.", true); return; }
  const n = Math.max(0, ...A.essais.map((e) => e.n)) + 1;
  const v0 = b ? b.img.v || {} : A.kind === "maya" ? { hair: "long" } : { heure: "crepuscule" };
  const cible = b && b.img.src ? b.img : { kind: A.kind, v: b ? deriver(v0, consigne, A.kind) : deriver(v0, consigne || "", A.kind) };
  const e = { n, consigne, base: b ? b.img : null, baseLib: b ? b.lib : null, methode: b ? "retouche" : "creation", statut: "traduction", quand: "à l'instant", cible };
  A.essais.unshift(e);
  if (A.essais.length > GARDES) A.essais.pop();
  S.sel = n; S.nouveau = n; S.jeter = null;
  if (ta) ta.value = "";
  rendreOutils(); changerVue();
  simuler(e);
}
function simuler(e) {
  const A = S.A;
  const T = (f, ms) => S.minuteurs.push(setTimeout(f, ms));
  const maj = () => { if (S.A !== A) return; if (regarde() === e) { rendreScene(); rendreLegende(false); } rendreJournal(); };
  T(() => { e.statut = "attente"; e.prompt = e.cible.kind === "maya" ? PROMPT_MAYA(e.cible.v) : e.cible.kind === "phare" ? PROMPT_PHARE(e.cible.v) : ""; maj(); }, 1900);
  T(() => {
    e.statut = "cours"; e.p = 0; maj();
    const tic = () => {
      if (S.A !== A) return;
      e.p = Math.min(100, e.p + 1.6 + Math.random() * 2.2);
      if (regarde() === e) majProgres(e); else { const v = document.querySelector(`[data-n="${e.n}"] .mini-p b`); if (v) v.style.setProperty("--p", e.p + "%"); }
      if (e.p < 100) T(tic, 140);
      else T(() => { e.statut = "termine"; e.img = e.cible; maj(); if (regarde() === e) rendreConsigne(); toast(`Essai n°${e.n} prêt. « Utiliser cet essai » pour en faire l'image de l'asset.`); }, 300);
    };

  ripple(el, ev);
  switch (act) {
    case "menu": S.menu = !S.menu; rendreTete(); break;
    case "edNom": S.edNom = true; rendreTete(); break;
    case "edDesc": S.edDesc = true; rendreTete(); break;
    case "descOk": A.desc = $("#descChamp").value; S.edDesc = false; rendreTete(); toast("Description enregistrée."); break;
    case "descNon": S.edDesc = false; rendreTete(); break;
    case "valider": basculerValidation(); break;
    case "agent": toast("L'agent ouvrirait sa conversation sur cet asset (hors maquette)."); break;
    case "voisin": toast("Navigation vers l'asset voisin (hors maquette)."); break;
    case "plan": ev.preventDefault(); toast("Ouvrirait la fiche du plan (hors maquette)."); break;
    case "delier": S.delier = el.dataset.k; rendreTete(); break;
    case "delierNon": S.delier = null; rendreTete(); break;
    case "delierOui": {
      const k = el.dataset.k, pill = el.closest(".citation");
      pill.classList.add("part");
      setTimeout(() => { A.plans = A.plans.filter((p) => p.e + p.p !== k); S.delier = null; rendreTete(); toast(`Délié de ${k.slice(0, 3)} · ${k.slice(3)}.`); }, RM ? 0 : 280);
      break;
    }
    case "dupliquer": S.menu = false; rendreTete(); toast(`Copie créée : ${A.code}_2. Elle s'ouvrirait ici.`); break;
    case "supprimer": toast("Suppression (hors maquette)."); break;
    case "retirerMenu": S.menu = false; S.retrait = true; rendreTete(); rendreOutils(); $("#retirerZone").scrollIntoView({ block: "nearest", behavior: "smooth" }); break;
    case "retirer": S.retrait = true; rendreOutils(); break;
    case "retirerNon": S.retrait = false; rendreOutils(); break;
    case "retirerOui": A.image = null; A.valide = false; A.essais.forEach((e) => (e.retenu = false)); S.retrait = false; S.sel = null; tout(); toast("Image retirée : le prochain essai repartira de zéro."); break;
    case "zoom": ouvrirZoom(); break;
    case "utiliser": {
      const r = regarde(); if (!r || r === "actuelle") break;
      A.essais.forEach((e) => (e.retenu = false)); r.retenu = true; A.image = r.img; const etaitValide = A.valide; A.valide = false;
      const touche = A.plans.filter((p) => !p.perime).slice(0, 2); touche.forEach((p) => (p.perime = true));
      S.sel = "actuelle"; tout();
      toast(`Essai n°${r.n} adopté : c'est l'image de l'asset${etaitValide ? ", à revalider" : ""}. ${touche.length ? `${touche.length} plan${touche.length > 1 ? "s déjà rendus sont périmés" : " déjà rendu est périmé"}.` : ""}`);
      break;
    }
    case "jeter": S.jeter = regarde().n; rendreLegende(false); break;
    case "jeterNon": S.jeter = null; rendreLegende(false); break;
    case "jeterOui": { const n = S.jeter; A.essais = A.essais.filter((e) => e.n !== n); S.jeter = null; S.sel = A.image ? "actuelle" : null; rendreOutils(); changerVue(); toast(`Essai n°${n} supprimé.`); break; }
    case "voirBase": {
      const r = regarde(); const m = r.baseLib && r.baseLib.match(/n°(\d+)/);
      S.sel = m ? Number(m[1]) : "actuelle"; changerVue(); break;
    }
    case "reprendreActuelle": S.sel = "actuelle"; changerVue(); break;
    case "zero": S.sel = null; changerVue(); break;
    case "puce": { const ta = $("#cTexte"); const t = el.textContent.trim(); ta.value = ta.value.trim() ? ta.value.trim().replace(/[.,;]$/, "") + ", " + t : t.charAt(0).toUpperCase() + t.slice(1); ta.focus(); break; }
    case "lancer": lancer(); break;
    case "relancer": { const r = regarde(); lancer(r.consigne); break; }
    case "reprendre": { const r = regarde(); S.sel = "actuelle"; changerVue(); const ta = $("#cTexte"); ta.value = r.consigne; ta.focus(); break; }
    case "lire": lire(); break;
    case "genVoix": toast("La voix serait générée à partir de cette description, puis un nouveau master remplacerait celui-ci."); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "cTexte" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $("#lancer"); ripple(b, {}); lancer(); }
  if (e.target.id === "nomChamp") {
    if (e.key === "Enter") { S.A.nom = e.target.value.trim() || S.A.nom; S.edNom = false; rendreTete(); toast("Nom enregistré. L'identifiant reste " + S.A.code + "."); }
    if (e.key === "Escape") { S.edNom = false; rendreTete(); }
  }
  if (e.target.id === "descChamp") {
    if (e.key === "Escape") { S.edDesc = false; rendreTete(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { S.A.desc = e.target.value; S.edDesc = false; rendreTete(); toast("Description enregistrée."); }
  }
  if (e.key === "Escape" && S.menu) { S.menu = false; rendreTete(); }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.closest && e.target.closest("#jListe")) {
    e.preventDefault();
    const items = [...document.querySelectorAll("#jListe [data-sel]")];
    const i = items.findIndex((x) => x.classList.contains("on"));
    const j = Math.max(0, Math.min(items.length - 1, i + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1)));
    const v = items[j].dataset.sel; S.sel = v === "actuelle" ? "actuelle" : Number(v); changerVue();
    $("#jListe .j-item.on")?.focus();
  }
});
document.addEventListener("focusout", (e) => {
  if (e.target.id === "nomChamp" && S.edNom) { S.A.nom = e.target.value.trim() || S.A.nom; S.edNom = false; setTimeout(rendreTete, 0); }
});
$("#importer").addEventListener("click", () => $("#fichier").click());
$("#fichier").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { S.A.image = { src: rd.result }; S.A.valide = true; S.A.essais.forEach((x) => (x.retenu = false)); S.A.ratio = "importée"; S.sel = "actuelle"; tout(); toast("Image importée : elle devient l'image de l'asset, déjà validée."); };
  rd.readAsDataURL(f); e.target.value = "";
});

charger("a");
})();
</script>
